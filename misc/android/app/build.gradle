apply plugin: 'com.android.application'

android {
    compileSdkVersion 36
    namespace 'com.voxelcraft.android.client'

    defaultConfig {
        applicationId 'com.voxelcraft.android.client'
        minSdkVersion 19
        targetSdkVersion 36

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'CMakeLists.txt'
        }
    }
}
