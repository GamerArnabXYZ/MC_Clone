plugins {
    id 'com.android.application'
}

android {
    namespace 'com.voxelcraft.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.voxelcraft.game"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
                cppFlags "-std=c11"
            }
        }

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        sourceSets {
            main {
                assets.srcDirs = ['assets']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}
