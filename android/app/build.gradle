plugins {
    id 'com.android.application'
}

android {
    namespace 'com.voxelcraft.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.voxelcraft.game"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                // Use c11 standard (game is pure C, not C++)
                cFlags "-std=c11 -Wall -Wno-unused-function -DPLATFORM_ANDROID"
                arguments "-DANDROID_STL=c++_static",
                          "-DANDROID_PLATFORM=android-21",
                          "-DANDROID_ARM_NEON=TRUE"
            }
        }

        ndk {
            // Build for 64-bit ARM (primary) and 32-bit ARM (fallback)
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    sourceSets {
        main {
            // Assets folder for textures etc.
            assets.srcDirs = ['src/main/assets']
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}
