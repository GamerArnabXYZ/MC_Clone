name: Build latest (Android)
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-android
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/saschpe/android-ndk:34-jdk17.0.8_7-ndk25.2.9519653-cmake3.22.1
    steps:
      - uses: actions/checkout@v4

      - name: Retrieve dependencies
        shell: bash
        run: |
          mkdir build-tools
          wget https://github.com/ClassiCube/rpi-compiling-stuff/raw/main/build-tools.zip
          unzip build-tools.zip -d build-tools
          chmod +x build-tools/aapt
          chmod +x build-tools/dx
          chmod +x build-tools/zipalign

      - name: Compile android builds
        shell: bash
        env:
          COMMON_FLAGS: "-O1 -s -fno-stack-protector -fno-math-errno -Qn -Werror"
          DROID_FLAGS: "-fPIC -shared -fvisibility=hidden -rdynamic -funwind-tables"
          LIBS: "-lGLESv2 -lEGL -lm -llog"
          SRCS: "src/*.c src/android/*.c third_party/bearssl/*.c"
        run: |
          LATEST_FLAG=-DCC_COMMIT_SHA=\"${GITHUB_SHA::9}\"
          DROID_FLAGS="-fPIC -shared -s -O1 -fvisibility=hidden -rdynamic -funwind-tables"

          ROOT_DIR=$PWD
          NDK_ROOT="/opt/android-sdk-linux/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin"
          TOOLS_ROOT=$ROOT_DIR/build-tools
          SDK_ROOT="/opt/android-sdk-linux/platforms/android-34"
          MAIN_DIR=$ROOT_DIR/misc/android/app/src/main

          # Compile native .so for each ABI
          $NDK_ROOT/armv7a-linux-androideabi19-clang ${{ env.SRCS }} $COMMON_FLAGS $DROID_FLAGS -mfpu=vfp3-d16 ${{ env.LIBS }} $LATEST_FLAG -o vc-droid-arm_32
          $NDK_ROOT/aarch64-linux-android21-clang    ${{ env.SRCS }} $COMMON_FLAGS $DROID_FLAGS ${{ env.LIBS }} $LATEST_FLAG -o vc-droid-arm_64

          # Generate fresh PKCS12 keystore
          keytool -genkeypair \
            -keystore $ROOT_DIR/release.keystore \
            -storetype pkcs12 \
            -alias voxelcraft \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass voxelcraft123 \
            -dname "CN=VoxelCraft,O=ArnabLabZ,C=BD"

          # Compile Java
          mkdir -p $MAIN_DIR/obj
          cd $MAIN_DIR/java/com/voxelcraft
          javac *.java -d $MAIN_DIR/obj -classpath $SDK_ROOT/android.jar --release 8

          cd $MAIN_DIR
          $TOOLS_ROOT/dx --dex --output=classes.dex ./obj

          # --- Build arm64-v8a APK ---
          mkdir -p lib/arm64-v8a
          cp $ROOT_DIR/vc-droid-arm_64 lib/arm64-v8a/libvoxelcraft.so

          $TOOLS_ROOT/aapt package -f -M AndroidManifest.xml -S res -F unsigned-arm64.apk -I $SDK_ROOT/android.jar
          $TOOLS_ROOT/aapt add -f unsigned-arm64.apk classes.dex lib/arm64-v8a/libvoxelcraft.so
          $TOOLS_ROOT/zipalign -f 4 unsigned-arm64.apk aligned-arm64.apk
          $TOOLS_ROOT/apksigner sign \
            --ks $ROOT_DIR/release.keystore \
            --ks-key-alias voxelcraft \
            --ks-pass pass:voxelcraft123 \
            --out $ROOT_DIR/app-arm64-v8a-release.apk \
            aligned-arm64.apk

          # --- Build armeabi-v7a APK ---
          rm -rf lib
          mkdir -p lib/armeabi-v7a
          cp $ROOT_DIR/vc-droid-arm_32 lib/armeabi-v7a/libvoxelcraft.so

          $TOOLS_ROOT/aapt package -f -M AndroidManifest.xml -S res -F unsigned-arm32.apk -I $SDK_ROOT/android.jar
          $TOOLS_ROOT/aapt add -f unsigned-arm32.apk classes.dex lib/armeabi-v7a/libvoxelcraft.so
          $TOOLS_ROOT/zipalign -f 4 unsigned-arm32.apk aligned-arm32.apk
          $TOOLS_ROOT/apksigner sign \
            --ks $ROOT_DIR/release.keystore \
            --ks-key-alias voxelcraft \
            --ks-pass pass:voxelcraft123 \
            --out $ROOT_DIR/app-armeabi-v7a-release.apk \
            aligned-arm32.apk

          echo "APKs ready:"
          ls -lh $ROOT_DIR/app-*.apk

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "VoxelCraft Build #${{ github.run_number }}"
          body: |
            🤖 Auto build from commit `${{ github.sha }}`
            - `app-arm64-v8a-release.apk` → Modern devices (64-bit)
            - `app-armeabi-v7a-release.apk` → Older devices (32-bit)
          prerelease: true
          files: |
            app-arm64-v8a-release.apk
            app-armeabi-v7a-release.apk
