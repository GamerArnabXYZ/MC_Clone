name: Build latest (Android)
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-android
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/saschpe/android-ndk:34-jdk17.0.8_7-ndk25.2.9519653-cmake3.22.1
    steps:
      - uses: actions/checkout@v4

      - name: Retrieve dependencies
        shell: bash
        run: |
          mkdir build-tools
          wget https://github.com/ClassiCube/rpi-compiling-stuff/raw/main/build-tools.zip
          unzip build-tools.zip -d build-tools
          chmod +x build-tools/aapt
          chmod +x build-tools/dx
          chmod +x build-tools/zipalign

      - name: Compile android builds
        shell: bash
        env:
          COMMON_FLAGS: "-O1 -s -fno-stack-protector -fno-math-errno -Qn -Werror"
          DROID_FLAGS: "-fPIC -shared -fvisibility=hidden -rdynamic -funwind-tables"
          LIBS: "-lGLESv2 -lEGL -lm -llog"
          SRCS: "src/*.c src/android/*.c third_party/bearssl/*.c"
        run: |
          LATEST_FLAG=-DCC_COMMIT_SHA=\"${GITHUB_SHA::9}\"

          DROID_FLAGS="-fPIC -shared -s -O1 -fvisibility=hidden -rdynamic -funwind-tables"

          ROOT_DIR=$PWD
          NDK_ROOT="/opt/android-sdk-linux/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin"
          TOOLS_ROOT=$ROOT_DIR/build-tools
          SDK_ROOT="/opt/android-sdk-linux/platforms/android-34"

          $NDK_ROOT/armv7a-linux-androideabi19-clang ${{ env.SRCS }} $COMMON_FLAGS $DROID_FLAGS -march=armv5 -rtlib=libgcc -L $ROOT_DIR/build-tools/runtime ${{ env.LIBS }} $LATEST_FLAG -o vc-droid-arm_16
          $NDK_ROOT/armv7a-linux-androideabi19-clang ${{ env.SRCS }} $COMMON_FLAGS $DROID_FLAGS -mfpu=vfp3-d16 ${{ env.LIBS }} $LATEST_FLAG -o vc-droid-arm_32
          $NDK_ROOT/aarch64-linux-android21-clang   ${{ env.SRCS }} $COMMON_FLAGS $DROID_FLAGS ${{ env.LIBS }} $LATEST_FLAG -o vc-droid-arm_64
          $NDK_ROOT/i686-linux-android21-clang      ${{ env.SRCS }} $COMMON_FLAGS $DROID_FLAGS ${{ env.LIBS }} $LATEST_FLAG -o vc-droid-x86_32
          $NDK_ROOT/x86_64-linux-android21-clang    ${{ env.SRCS }} $COMMON_FLAGS $DROID_FLAGS ${{ env.LIBS }} $LATEST_FLAG -o vc-droid-x86_64

          cd $ROOT_DIR/misc/android/app/src/main
          mkdir -p lib/armeabi lib/armeabi-v7a lib/arm64-v8a lib/x86 lib/x86_64
          cp $ROOT_DIR/vc-droid-arm_16 lib/armeabi/libvoxelcraft.so
          cp $ROOT_DIR/vc-droid-arm_32 lib/armeabi-v7a/libvoxelcraft.so
          cp $ROOT_DIR/vc-droid-arm_64 lib/arm64-v8a/libvoxelcraft.so
          cp $ROOT_DIR/vc-droid-x86_32 lib/x86/libvoxelcraft.so
          cp $ROOT_DIR/vc-droid-x86_64 lib/x86_64/libvoxelcraft.so

          # compile java files
          mkdir -p $ROOT_DIR/misc/android/app/src/main/obj
          cd $ROOT_DIR/misc/android/app/src/main/java/com/voxelcraft
          javac *.java -d $ROOT_DIR/misc/android/app/src/main/obj -classpath $SDK_ROOT/android.jar --release 8

          cd $ROOT_DIR/misc/android/app/src/main
          echo -n "${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}" | base64 --decode > debug.keystore

          $TOOLS_ROOT/dx --dex --output=classes.dex ./obj
          $TOOLS_ROOT/aapt package -f -M AndroidManifest.xml -S res -F vc-unsigned.apk -I $SDK_ROOT/android.jar
          $TOOLS_ROOT/aapt add -f vc-unsigned.apk classes.dex \
            lib/armeabi/libvoxelcraft.so \
            lib/armeabi-v7a/libvoxelcraft.so \
            lib/arm64-v8a/libvoxelcraft.so \
            lib/x86/libvoxelcraft.so \
            lib/x86_64/libvoxelcraft.so

          $TOOLS_ROOT/zipalign -f 4 vc-unsigned.apk vc-signed.apk
          $TOOLS_ROOT/apksigner sign --ks debug.keystore --ks-pass pass:android vc-signed.apk
          cp vc-signed.apk $ROOT_DIR/src/VoxelCraft.apk

      - uses: ./.github/actions/upload_build
        with:
          SOURCE_FILE: 'src/VoxelCraft.apk'
          DEST_NAME: 'VoxelCraft.apk'

      - uses: ./.github/actions/notify_success
        with:
          DESTINATION_URL: '${{ secrets.NOTIFY_URL }}'
          WORKFLOW_NAME: 'android'

      - uses: ./.github/actions/notify_failure
        if: failure()
        with:
          NOTIFY_MESSAGE: 'Failed to produce VoxelCraft android build'
          WEBHOOK_URL: '${{ secrets.WEBHOOK_URL }}'
