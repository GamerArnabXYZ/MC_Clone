# Android Build Workflow
# Builds the game as an Android APK using Raylib + Android NDK

name: Android Build

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  ANDROID_API_LEVEL: '21'
  raylib_version: '5.0'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wget unzip cmake ninja-build make git

      - name: Setup Android SDK + cmdline-tools
        run: |
          unset ANDROID_HOME ANDROID_SDK_ROOT
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools"           >> $GITHUB_PATH

      - name: Accept licenses & install SDK components
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          # Unset conflicting var so sdkmanager uses only ANDROID_HOME
          unset ANDROID_SDK_ROOT
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-${{ env.ANDROID_API_LEVEL }}" "build-tools;34.0.0"

      - name: Install Android NDK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          unset ANDROID_SDK_ROOT
          # Try stable NDK versions in order of preference
          NDK_INSTALLED=""
          for ndk_ver in "25.2.9519653" "23.2.8568313" "21.4.7075529"; do
            echo "Trying NDK $ndk_ver..."
            if sdkmanager "ndk;$ndk_ver" 2>/dev/null; then
              NDK_INSTALLED="$HOME/android-sdk/ndk/$ndk_ver"
              echo "NDK_HOME=$NDK_INSTALLED" >> $GITHUB_ENV
              echo "Installed NDK at: $NDK_INSTALLED"
              break
            fi
          done
          if [ -z "$NDK_INSTALLED" ]; then
            echo "ERROR: No NDK version could be installed"
            exit 1
          fi

      - name: Clone & Build Raylib for Android (arm64-v8a)
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
        run: |
          git clone --depth 1 --branch ${{ env.raylib_version }} \
            https://github.com/raysan5/raylib.git raylib

          cd raylib/src

          # Build raylib as static lib for Android arm64
          # ANDROID_NDK_HOME, ANDROID_API and ABI must all be set
          make PLATFORM=PLATFORM_ANDROID \
               ANDROID_NDK=$NDK_HOME \
               ANDROID_NDK_HOME=$NDK_HOME \
               ANDROID_API=${{ env.ANDROID_API_LEVEL }} \
               ANDROID_ARCH=arm64 \
               RAYLIB_LIBTYPE=STATIC \
               -j$(nproc) 2>&1

          ls -la libraylib.a
          echo "Raylib Android build OK"

      - name: Copy raylib library to Android project
        run: |
          # CMakeLists expects the lib at cpp/libs/libraylib.a
          mkdir -p android/app/src/main/cpp/libs
          cp raylib/src/libraylib.a android/app/src/main/cpp/libs/
          # Also copy raylib headers
          mkdir -p android/app/src/main/cpp/raylib_include
          cp raylib/src/raylib.h  android/app/src/main/cpp/raylib_include/
          cp raylib/src/raymath.h android/app/src/main/cpp/raylib_include/ 2>/dev/null || true
          cp raylib/src/rlgl.h    android/app/src/main/cpp/raylib_include/ 2>/dev/null || true

      - name: Copy game source files into Android project
        run: |
          mkdir -p android/app/src/main/cpp/game_src
          mkdir -p android/app/src/main/cpp/game_include
          # main game sources (exclude android stub)
          cp src/input.c  android/app/src/main/cpp/game_src/
          cp src/render.c android/app/src/main/cpp/game_src/
          cp src/world.c  android/app/src/main/cpp/game_src/
          cp src/main.c   android/app/src/main/cpp/
          # headers
          cp include/*.h  android/app/src/main/cpp/game_include/
          # assets
          mkdir -p android/app/src/main/assets/textures
          [ -d assets/textures ] && cp -r assets/textures/. android/app/src/main/assets/textures/ || true

      - name: Update CMakeLists to include raylib headers
        run: |
          # Patch CMakeLists to also include the copied raylib headers
          sed -i 's|${CMAKE_CURRENT_SOURCE_DIR}/game_include|${CMAKE_CURRENT_SOURCE_DIR}/game_include\n    ${CMAKE_CURRENT_SOURCE_DIR}/raylib_include|' \
            android/app/src/main/cpp/CMakeLists.txt || true

      - name: Setup Gradle wrapper
        working-directory: android
        run: |
          # Use Gradle wrapper task to pin a specific version.
          # AGP 8.2.2 requires Gradle 8.2+; 8.9 is stable and compatible.
          # We do NOT rely on the runner's system Gradle version (currently 9.x).
          gradle wrapper --gradle-version=8.9 --distribution-type=bin 2>&1
          chmod +x gradlew
          ./gradlew --version

      - name: Create local.properties for Gradle
        working-directory: android
        run: |
          # Unambiguously tell Gradle where the SDK is via local.properties.
          # This avoids the conflict between ANDROID_HOME and the runner's
          # pre-installed ANDROID_SDK_ROOT environment variable.
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Build debug APK
        working-directory: android
        run: |
          # Unset the runner's SDK root so only local.properties is used
          unset ANDROID_SDK_ROOT
          ./gradlew assembleDebug \
            --no-daemon \
            --warning-mode=all \
            --stacktrace \
            2>&1

      - name: Verify APK output
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            ls -lh "$APK_PATH"
            echo "APK built successfully!"
          else
            echo "APK not found at expected path"
            find android/app/build -name "*.apk" 2>/dev/null || echo "No APK found anywhere"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voxelcraft-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Android source package
        uses: actions/upload-artifact@v4
        with:
          name: voxelcraft-android-source
          path: android/
          retention-days: 90
