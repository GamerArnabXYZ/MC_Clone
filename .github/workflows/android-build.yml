# Android Build Workflow
# Builds VoxelCraft as Android APK using Raylib 5.0 + Android NDK

name: Android Build

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  ANDROID_API_LEVEL: '21'
  raylib_version: '5.0'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wget unzip cmake ninja-build make git binutils

      # ── Android SDK ──────────────────────────────────────────────────────
      - name: Setup Android SDK
        run: |
          unset ANDROID_HOME ANDROID_SDK_ROOT
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools"           >> $GITHUB_PATH

      - name: Accept licenses & install SDK components
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          unset ANDROID_SDK_ROOT
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-${{ env.ANDROID_API_LEVEL }}" "build-tools;34.0.0"

      - name: Install Android NDK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          unset ANDROID_SDK_ROOT
          NDK_INSTALLED=""
          for ndk_ver in "25.2.9519653" "23.2.8568313" "21.4.7075529"; do
            echo "Trying NDK $ndk_ver..."
            if sdkmanager "ndk;$ndk_ver" 2>/dev/null; then
              NDK_INSTALLED="$HOME/android-sdk/ndk/$ndk_ver"
              echo "NDK_HOME=$NDK_INSTALLED" >> $GITHUB_ENV
              echo "Installed NDK: $ndk_ver at $NDK_INSTALLED"
              break
            fi
          done
          if [ -z "$NDK_INSTALLED" ]; then
            echo "ERROR: No NDK version could be installed"
            exit 1
          fi
          ls "$NDK_INSTALLED/build/cmake/android.toolchain.cmake" && echo "Toolchain OK"


      # ── Build Raylib for Android via CMake ───────────────────────────────
      # Using cmake instead of make because cmake properly respects
      # SUPPORT_MODULE_RMODELS=OFF — the make flag was ignored.
      - name: Clone Raylib
        run: |
          git clone --depth 1 --branch ${{ env.raylib_version }} \
            https://github.com/raysan5/raylib.git raylib

      - name: Build Raylib for Android (arm64-v8a) via CMake
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
        run: |
          mkdir -p raylib/build-android
          cd raylib/build-android

          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${{ env.ANDROID_API_LEVEL }} \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DPLATFORM=Android \
            -DGRAPHICS=GRAPHICS_API_OPENGL_ES2 \
            -DSUPPORT_MODULE_RMODELS=OFF \
            -DSUPPORT_MODULE_RAUDIO=OFF \
            -DSUPPORT_MODULE_RTEXT=ON \
            -DSUPPORT_MODULE_RSHAPES=ON \
            -DSUPPORT_MODULE_RTEXTURES=ON

          cmake --build . --config Release -j$(nproc) 2>&1

          # Find the built library
          find . -name "libraylib.a" | head -5
          echo "Raylib Android cmake build OK"

      - name: Copy Raylib to Android project
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
        run: |
          RAYLIB_A=$(find raylib/build-android -name "libraylib.a" | head -1)
          echo "Found: $RAYLIB_A"

          mkdir -p android/app/src/main/cpp/libs
          cp "$RAYLIB_A" android/app/src/main/cpp/libs/libraylib.a

          mkdir -p android/app/src/main/cpp/raylib_include
          cp raylib/src/raylib.h  android/app/src/main/cpp/raylib_include/
          cp raylib/src/raymath.h android/app/src/main/cpp/raylib_include/ 2>/dev/null || true
          cp raylib/src/rlgl.h    android/app/src/main/cpp/raylib_include/ 2>/dev/null || true

          ls -lh android/app/src/main/cpp/libs/libraylib.a

      # ── Copy game sources ────────────────────────────────────────────────
      - name: Copy game sources into Android project
        run: |
          mkdir -p android/app/src/main/cpp/game_src
          mkdir -p android/app/src/main/cpp/game_include
          cp src/input.c  android/app/src/main/cpp/game_src/
          cp src/render.c android/app/src/main/cpp/game_src/
          cp src/world.c  android/app/src/main/cpp/game_src/
          cp src/main.c   android/app/src/main/cpp/
          cp include/*.h  android/app/src/main/cpp/game_include/
          mkdir -p android/app/src/main/assets/textures
          [ -d assets/textures ] && cp -r assets/textures/. android/app/src/main/assets/textures/ || true

      # ── Gradle build ─────────────────────────────────────────────────────
      - name: Create local.properties
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Setup Gradle wrapper
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          unset ANDROID_SDK_ROOT
          gradle wrapper --gradle-version=8.9 --distribution-type=bin 2>&1
          chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          unset ANDROID_SDK_ROOT
          ./gradlew assembleDebug \
            --no-daemon \
            --warning-mode=all \
            --stacktrace \
            2>&1

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            ls -lh "$APK"
            echo "APK built successfully!"
          else
            find android/app/build -name "*.apk" 2>/dev/null || echo "No APK found"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voxelcraft-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Android source
        uses: actions/upload-artifact@v4
        with:
          name: voxelcraft-android-source
          path: android/
          retention-days: 90
