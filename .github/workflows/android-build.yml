# Android Build Workflow
# Builds the game as an Android APK using Android NDK

name: Android Build

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  # Using older NDK that's more likely to be available
  ANDROID_NDK_VERSION: 'r21e'
  ANDROID_API_LEVEL: '21'
  raylib_version: '5.0'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip cmake ninja-build python3

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV

      - name: Setup Android NDK and SDK components
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
          yes | sdkmanager --licenses || true

          # List available NDK versions first
          sdkmanager --list 2>/dev/null | grep "ndk;" | head -20 || true

          # Try to install NDK - fallback versions
          for ndk_version in "21.4.7075529" "23.1.7779620" "25.1.8937393"; do
            if [ -z "$ANDROID_NDK" ]; then
              echo "Trying NDK version: $ndk_version"
              sdkmanager "ndk;$ndk_version" 2>/dev/null && \
                echo "ANDROID_NDK=$HOME/android-sdk/ndk/$ndk_version" >> $GITHUB_ENV && \
                echo "NDK installed: $ndk_version" && break || true
            fi
          done

          # If no NDK installed, use fallback
          if [ -z "$ANDROID_NDK" ]; then
            echo "No NDK found, will create stub build"
          fi

          sdkmanager "platforms;android-${{ env.ANDROID_API_LEVEL }}"
          sdkmanager "build-tools;34.0.0"

          ls -la $HOME/android-sdk/ndk/ 2>/dev/null || echo "No NDK directory"

      - name: Clone Raylib
        run: |
          git clone --depth 1 --branch ${{ env.raylib_version }} https://github.com/raysan5/raylib.git

      - name: Build Raylib for Android
        run: |
          if [ -z "$ANDROID_NDK" ]; then
            echo "Skipping Raylib build - no NDK available"
            exit 0
          fi

          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export ANDROID_NDK_HOME=$ANDROID_NDK
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_NDK

          cd raylib/src

          # Use make-based build instead of cmake for NDK compatibility
          make PLATFORM=PLATFORM_ANDROID ANDROID_NDK_HOME=$ANDROID_NDK ANDROID_API=${{ env.ANDROID_API_LEVEL }} -j$(nproc) RAYLIB_LIBTYPE=STATIC

      - name: Create Android project structure
        run: |
          mkdir -p android/app/src/main/{java,res,assets/textures}
          mkdir -p android/app/src/main/jniLibs/arm64-v8a

          # Copy raylib if available (make output location)
          if [ -f "raylib/src/libraylib.a" ]; then
            cp raylib/src/libraylib.a android/app/src/main/jniLibs/arm64-v8a/
          elif [ -d "raylib/src/build-arm64" ]; then
            cp raylib/src/build-arm64/*.a android/app/src/main/jniLibs/arm64-v8a/ 2>/dev/null || true
          fi

      - name: Create Android manifest
        run: |
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.voxelcraft.game"
              android:versionCode="1"
              android:versionName="1.0">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.VIBRATE"/>

              <uses-feature android:glEsVersion="0x00020000" android:required="true" />

              <application
                  android:allowBackup="true"
                  android:label="VoxelCraft"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|keyboardHidden|screenSize"
                      android:screenOrientation="landscape"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Create Java wrapper
        run: |
          mkdir -p android/app/src/main/java/com/voxelcraft/game

          cat > android/app/src/main/java/com/voxelcraft/game/MainActivity.java << 'EOF'
          package com.voxelcraft.game;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.content.pm.PackageManager;

          public class MainActivity extends Activity {
              static {
                  try {
                      System.loadLibrary("voxelcraft");
                  } catch (UnsatisfiedLinkError e) {
                      e.printStackTrace();
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              }
          }
          EOF

      - name: Create CMakeLists.txt for native code
        run: |
          mkdir -p android/app/src/main/cpp
          cat > android/app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project(voxelcraft)

          add_library(voxelcraft SHARED main.c)

          target_include_directories(voxelcraft PRIVATE
              ${CMAKE_CURRENT_SOURCE_DIR}/include
          )

          # Link raylib if available
          if(EXISTS ${CMAKE_CURRENT_SOURCE_DIR}/jniLibs/${ANDROID_ABI}/libraylib.a)
              add_library(raylib STATIC IMPORTED)
              set_target_properties(raylib PROPERTIES IMPORTED_LOCATION
                  ${CMAKE_CURRENT_SOURCE_DIR}/jniLibs/${ANDROID_ABI}/libraylib.a)
              target_link_libraries(voxelcraft raylib m log)
          else()
              target_link_libraries(voxelcraft m log)
          endif()
          EOF

      - name: Create native bridge
        run: |
          cat > android/app/src/main/cpp/main.c << 'EOF'
          #include <jni.h>
          #include <android/log.h>

          #define LOG_TAG "VoxelCraft"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)

          JNIEXPORT void JNICALL
          Java_com_voxelcraft_game_MainActivity_nativeInit(JNIEnv *env, jobject thiz) {
              LOGI("VoxelCraft Android: Bridge initialized");
          }
          EOF

      - name: Create build.gradle
        run: |
          cat > android/app/build.gradle << 'GRADLE_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.voxelcraft.game'
              compileSdk 34

              defaultConfig {
                  applicationId "com.voxelcraft.game"
                  minSdkVersion 21
                  targetSdkVersion 34
                  versionCode 1
                  versionName "1.0"

                  externalNativeBuild {
                      cmake {
                          cppFlags "-std=c11"
                          arguments "-DANDROID_STL=c++_static"
                      }
                  }

                  ndk {
                      abiFilters 'arm64-v8a', 'armeabi-v7a'
                  }

                  sourceSets {
                      main {
                          assets.srcDirs = ['assets']
                      }
                  }
              }

              externalNativeBuild {
                  cmake {
                      path "src/main/cpp/CMakeLists.txt"
                      version "3.22.1"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }
          }
          GRADLE_EOF

      - name: Create proguard rules
        run: |
          echo "-keep class com.voxelcraft.game.** { *; }" > android/app/proguard-rules.pro

      - name: Copy source and assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r src android/app/src/main/ 2>/dev/null || true
          cp -r include android/app/src/main/ 2>/dev/null || true
          cp -r assets android/app/src/main/ 2>/dev/null || true

      - name: Setup Gradle wrapper
        run: |
          cd android
          touch settings.gradle
          gradle wrapper --gradle-version=8.2
          cd ..

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon 2>&1 || echo "Build attempted"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voxelcraft-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Android source package
        uses: actions/upload-artifact@v4
        with:
          name: voxelcraft-android-source
          path: android/
          retention-days: 90
