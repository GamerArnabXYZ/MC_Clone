# Android Build Workflow
# Builds the game as an Android APK using Android NDK

name: Android Build

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  ANDROID_NDK_VERSION: 'r25b'
  ANDROID_API_LEVEL: '21'
  raylib_version: '5.0'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip cmake ninja-build python3

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV

      - name: Setup Android NDK
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;${{ env.ANDROID_NDK_VERSION }}"
          sdkmanager "platforms;android-${{ env.ANDROID_API_LEVEL }}"
          sdkmanager "build-tools;34.0.0"
          echo "ANDROID_NDK=$HOME/android-sdk/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV

      - name: Clone Raylib
        run: |
          git clone --depth 1 --branch ${{ env.raylib_version }} https://github.com/raysan5/raylib.git

      - name: Build Raylib for Android
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export ANDROID_NDK=$HOME/android-sdk/ndk/${{ env.ANDROID_NDK_VERSION }}
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_NDK

          cd raylib/src

          # Build for arm64-v8a
          mkdir -p build-arm64
          cd build-arm64
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${{ env.ANDROID_API_LEVEL }} \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

          # Build for armeabi-v7a
          cd ..
          mkdir -p build-armeabi
          cd build-armeabi
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-${{ env.ANDROID_API_LEVEL }} \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

          # Build for x86_64
          cd ..
          mkdir -p build-x86_64
          cd build-x86_64
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=x86_64 \
            -DANDROID_PLATFORM=android-${{ env.ANDROID_API_LEVEL }} \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Create Android project structure
        run: |
          mkdir -p android/app/src/main/{java,res,assets/textures}
          mkdir -p android/app/src/main/jniLibs/{arm64-v8a,armeabi-v7a,x86_64}

          # Copy raylib prebuilt libraries
          cp raylib/src/build-arm64/*.so android/app/src/main/jniLibs/arm64-v8a/ 2>/dev/null || true
          cp raylib/src/build-armeabi/*.so android/app/src/main/jniLibs/armeabi-v7a/ 2>/dev/null || true
          cp raylib/src/build-x86_64/*.so android/app/src/main/jniLibs/x86_64/ 2>/dev/null || true

      - name: Create Android manifest
        run: |
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.voxelcraft.game"
              android:versionCode="1"
              android:versionName="1.0">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.VIBRATE"/>

              <uses-feature android:glEsVersion="0x00030000" android:required="true" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="VoxelCraft"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|keyboardHidden|screenSize"
                      android:screenOrientation="landscape"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Create Java wrapper
        run: |
          mkdir -p android/app/src/main/java/com/voxelcraft/game

          cat > android/app/src/main/java/com/voxelcraft/game/MainActivity.java << 'EOF'
          package com.voxelcraft.game;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.WindowManager;

          public class MainActivity extends Activity {
              static {
                  System.loadLibrary("voxelcraft");
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  nativeInit();
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  nativeClose();
              }

              private native void nativeInit();
              private native void nativeClose();
          }
          EOF

      - name: Create build.gradle for Android
        run: |
          cat > android/app/build.gradle << 'GRADLE_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.voxelcraft.game'
              compileSdk 34

              defaultConfig {
                  applicationId "com.voxelcraft.game"
                  minSdkVersion 21
                  targetSdkVersion 34
                  versionCode 1
                  versionName "1.0"

                  externalNativeBuild {
                      cmake {
                          cppFlags "-std=c11"
                          arguments "-DANDROID_STL=c++_static"
                      }
                  }

                  ndk {
                      abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
                  }
              }

              externalNativeBuild {
                  cmake {
                      path "../../CMakeLists.txt"
                      version "3.22.1"
                  }
              }

              sourceSets {
                  main {
                      assets.srcDirs = ['assets']
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      minifyEnabled false
                  }
              }
          }
          GRADLE_EOF

      - name: Create proguard rules
        run: |
          echo "-keep class com.voxelcraft.game.** { *; }" > android/app/proguard-rules.pro

      - name: Copy native source
        run: |
          cp -r src android/app/src/main/
          cp -r include android/app/src/main/
          cp -r assets android/app/src/main/

      - name: Setup Gradle wrapper
        run: |
          cd android
          touch settings.gradle
          gradle wrapper --gradle-version=8.2
          cd ..

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --warning-mode=all

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voxelcraft-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Android source package
        uses: actions/upload-artifact@v4
        with:
          name: voxelcraft-android-source
          path: android/
          retention-days: 90
