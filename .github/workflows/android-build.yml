# Android Build Workflow
# Builds the game as an Android APK using Android NDK

name: Android Build

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  ANDROID_NDK_VERSION: 'r21e'
  ANDROID_API_LEVEL: '21'
  raylib_version: '5.0'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip cmake ninja-build python3

      - name: Setup Android SDK
        run: |
          # Unset any conflicting SDK vars
          unset ANDROID_HOME
          unset ANDROID_SDK_ROOT

          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV

      - name: Setup Android NDK and SDK components
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true

          # Try to install NDK - multiple fallback versions
          for ndk_version in "21.4.7075529" "23.1.7779620" "25.1.8937393"; do
            if [ -z "$ANDROID_NDK" ]; then
              echo "Trying NDK version: $ndk_version"
              sdkmanager "ndk;$ndk_version" 2>/dev/null && \
                echo "ANDROID_NDK=$HOME/android-sdk/ndk/$ndk_version" >> $GITHUB_ENV && \
                echo "NDK installed: $ndk_version" && break || true
            fi
          done

          sdkmanager "platforms;android-${{ env.ANDROID_API_LEVEL }}"
          sdkmanager "build-tools;34.0.0"

      - name: Clone and Build Raylib for Android
        run: |
          if [ -z "$ANDROID_NDK" ]; then
            echo "Skipping Raylib build - no NDK available"
            exit 0
          fi

          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_NDK_HOME=$ANDROID_NDK
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_NDK

          git clone --depth 1 --branch ${{ env.raylib_version }} https://github.com/raysan5/raylib.git

          cd raylib/src
          make PLATFORM=PLATFORM_ANDROID ANDROID_NDK_HOME=$ANDROID_NDK ANDROID_API=${{ env.ANDROID_API_LEVEL }} -j$(nproc) RAYLIB_LIBTYPE=STATIC

          cd ..

          # Copy raylib to android project
          mkdir -p android/app/libs
          cp src/libraylib.a android/app/libs/ 2>/dev/null || true

      - name: Copy source files and assets
        run: |
          cp -r src android/app/src/main/ 2>/dev/null || true
          cp -r include android/app/src/main/ 2>/dev/null || true
          cp -r assets android/app/src/main/ 2>/dev/null || true

      - name: Setup Gradle wrapper
        working-directory: android
        run: |
          # Use compatible Gradle version for AGP 8.2.2
          gradle wrapper --gradle-version=8.5
          ls -la

      - name: Build debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --warning-mode=all 2>&1 || {
            echo "Build failed, checking what went wrong..."
            ls -la
            ls -la app/
          }

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voxelcraft-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Android source package
        uses: actions/upload-artifact@v4
        with:
          name: voxelcraft-android-source
          path: android/
          retention-days: 90
