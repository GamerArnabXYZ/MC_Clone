# Android Build Workflow
# Builds the game as an Android APK using Android NDK

name: Android Build

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  # Using newer NDK version that's available
  ANDROID_NDK_VERSION: 'r26b'
  ANDROID_API_LEVEL: '24'
  raylib_version: '5.0'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip cmake ninja-build python3

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV

      - name: Setup Android NDK and SDK components
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
          yes | sdkmanager --licenses || true

          # Install NDK, platform, and build-tools
          sdkmanager "ndk;${{ env.ANDROID_NDK_VERSION }}"
          sdkmanager "platforms;android-${{ env.ANDROID_API_LEVEL }}"
          sdkmanager "build-tools;34.0.0"

          echo "ANDROID_NDK=$HOME/android-sdk/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV

          # Verify installation
          ls -la $HOME/android-sdk/ndk/

      - name: Clone Raylib
        run: |
          git clone --depth 1 --branch ${{ env.raylib_version }} https://github.com/raysan5/raylib.git

      - name: Build Raylib for Android
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export ANDROID_NDK=$HOME/android-sdk/ndk/${{ env.ANDROID_NDK_VERSION }}
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_NDK

          cd raylib/src

          # Build for arm64-v8a
          mkdir -p build-arm64
          cd build-arm64
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${{ env.ANDROID_API_LEVEL }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=1
          make -j$(nproc)

          cd ..

      - name: Create Android project structure
        run: |
          mkdir -p android/app/src/main/{java,res,assets/textures}
          mkdir -p android/app/src/main/jniLibs/arm64-v8a

          # Copy raylib prebuilt libraries
          cp raylib/src/build-arm64/*.a android/app/src/main/jniLibs/arm64-v8a/ 2>/dev/null || true

      - name: Create Android manifest
        run: |
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.voxelcraft.game"
              android:versionCode="1"
              android:versionName="1.0">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.VIBRATE"/>

              <uses-feature android:glEsVersion="0x00030000" android:required="true" />

              <application
                  android:allowBackup="true"
                  android:label="VoxelCraft"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|keyboardHidden|screenSize"
                      android:screenOrientation="landscape"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Create Java wrapper
        run: |
          mkdir -p android/app/src/main/java/com/voxelcraft/game

          cat > android/app/src/main/java/com/voxelcraft/game/MainActivity.java << 'EOF'
          package com.voxelcraft.game;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.WindowManager;

          public class MainActivity extends Activity {
              static {
                  System.loadLibrary("voxelcraft");
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              }

              private native void nativeInit();
              private native void nativeClose();
          }
          EOF

      - name: Create CMakeLists.txt for Android native code
        run: |
          cat > android/app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project(voxelcraft)

          add_library(voxelcraft SHARED main.c)

          target_include_directories(voxelcraft PRIVATE
              ${CMAKE_CURRENT_SOURCE_DIR}/include
          )

          # Link with prebuilt raylib
          add_library(raylib STATIC IMPORTED)
          set_target_properties(raylib PROPERTIES IMPORTED_LOCATION
              ${CMAKE_CURRENT_SOURCE_DIR}/jniLibs/${ANDROID_ABI}/libraylib.a
          )

          target_link_libraries(voxelcraft raylib m log)
          EOF

          mkdir -p android/app/src/main/cpp

      - name: Create native C bridge file
        run: |
          cat > android/app/src/main/cpp/main.c << 'EOF'
          // Native bridge for Android
          #include <jni.h>
          #include <android/log.h>

          #define LOG_TAG "VoxelCraft"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)

          JNIEXPORT void JNICALL
          Java_com_voxelcraft_game_MainActivity_nativeInit(JNIEnv *env, jobject thiz) {
              LOGI("VoxelCraft Android: Init called");
          }
          EOF

      - name: Create build.gradle for Android
        run: |
          cat > android/app/build.gradle << 'GRADLE_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.voxelcraft.game'
              compileSdk 34

              defaultConfig {
                  applicationId "com.voxelcraft.game"
                  minSdkVersion 24
                  targetSdkVersion 34
                  versionCode 1
                  versionName "1.0"

                  externalNativeBuild {
                      cmake {
                          cppFlags "-std=c11"
                          arguments "-DANDROID_STL=c++_static"
                      }
                  }

                  ndk {
                      abiFilters 'arm64-v8a'
                  }

                  sourceSets {
                      main {
                          assets.srcDirs = ['assets']
                      }
                  }
              }

              externalNativeBuild {
                  cmake {
                      path "src/main/cpp/CMakeLists.txt"
                      version "3.22.1"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }
          }
          GRADLE_EOF

      - name: Copy source and assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r src android/app/src/main/
          cp -r include android/app/src/main/
          cp -r assets android/app/src/main/

      - name: Setup Gradle wrapper
        run: |
          cd android
          touch settings.gradle
          gradle wrapper --gradle-version=8.2
          cd ..

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon 2>&1

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voxelcraft-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Android source package
        uses: actions/upload-artifact@v4
        with:
          name: voxelcraft-android-source
          path: android/
          retention-days: 90
