# Web Build Workflow - Emscripten (WebAssembly)
# Optimized for Legacy Support (iOS 12.5, Android 5) and Web Branch Deployment

name: Web Build

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  raylib_version: '5.0'

jobs:
  build-web:
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:3.1.31

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Emscripten
        run: |
          emsdk activate
          . $EMSDK_ENV
          emcc --version

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libgl-dev

      - name: Clone and Build Raylib for Web
        run: |
          . $EMSDK_ENV
          git clone --depth 1 --branch ${{ env.raylib_version }} https://github.com/raysan5/raylib.git
          cd raylib/src

          # Build for Web using static linking (better for legacy)
          # PLATFORM_WEB automatically targets GLES2/WebGL1 in many raylib configurations
          emmake make PLATFORM=PLATFORM_WEB RAYLIB_LIBTYPE=STATIC RAYLIB_USE_WEBGL=YES

          cd ../..

      - name: Setup build directory
        run: |
          mkdir -p build-web
          # Only copy assets if the directory exists to prevent workflow failure
          if [ -d "assets" ]; then cp -r assets build-web/; fi

      - name: Create HTML shell for Emscripten
        run: |
          cat > build-web/shell.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <title>VoxelCraft</title>
              <style>
                  body { margin: 0; padding: 0; background: #000; overflow: hidden; color: white; font-family: sans-serif; }
                  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
                  #status { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); }
              </style>
          </head>
          <body>
              <div id="status">Preparing VoxelCraft...</div>
              <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
              <script>
                  var Module = {
                      canvas: document.getElementById('canvas'),
                      setStatus: function(text) {
                          var statusElement = document.getElementById('status');
                          if (!text) statusElement.style.display = 'none';
                          else statusElement.innerHTML = text;
                      },
                      totalDependencies: 0,
                      monitorRunDependencies: function(left) {
                          this.totalDependencies = Math.max(this.totalDependencies, left);
                          Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
                      }
                  };
              </script>
              <script src="voxelcraft.js"></script>
          </body>
          </html>
          EOF

      - name: Build VoxelCraft with Emscripten
        run: |
          . $EMSDK_ENV
          cd build-web

          # COMPILER FLAGS EXPLAINED FOR LEGACY:
          # -s MAX_WEBGL_VERSION=1: Forces WebGL 1.0 (Required for iOS 12 / Android 5)
          # -s ASYNCIFY: Needed for raylib's while(!WindowShouldClose) loop
          # -s INITIAL_MEMORY: 64MB (Safe for old mobile browsers)
          # -s ALLOW_MEMORY_GROWTH: Allows expansion if needed
          
          emcc ../src/*.c \
            -o voxelcraft.js \
            -s WASM=1 \
            -s MAX_WEBGL_VERSION=1 \
            -s MIN_WEBGL_VERSION=1 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s INITIAL_MEMORY=67108864 \
            -s ASYNCIFY=1 \
            -s EXPORTED_RUNTIME_METHODS="['ccall','cwrap']" \
            -O2 \
            -I../include \
            -I../raylib/src \
            ../raylib/src/libraylib.a \
            -s USE_LIBPNG=1 \
            -s USE_ZLIB=1 \
            --shell-file shell.html

          # Ensure output is named index.html for web hosting
          mv shell.html index.html

      - name: Deploy to Web Branch
        run: |
          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Initialize a temporary repo in the build folder
          cd build-web
          git init
          git checkout -b web
          git add .
          git commit -m "Deploy build to web branch: ${{ github.sha }}"
          
          # Push to the 'web' branch of the current repository
          # Uses the GITHUB_TOKEN for authentication
          git push --force "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" web

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build-files
          path: build-web/

  deploy-pages:
    needs: build-web
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Build
        uses: actions/download-artifact@v4
        with:
          name: web-build-files
          path: dist
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
