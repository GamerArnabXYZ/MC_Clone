# Web Build Workflow - Emscripten (WebAssembly)
# Builds the game for web browsers with legacy device support

name: Web Build

on:
  push:
    branches: [main, master, web]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master, web]
  workflow_dispatch:

env:
  raylib_version: '5.0'

jobs:
  build-web:
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:3.1.31

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Emscripten
        run: |
          emsdk activate
          . $EMSDK_ENV
          emcc --version

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libgl-dev

      - name: Clone and Build Raylib for Web
        run: |
          . $EMSDK_ENV
          git clone --depth 1 --branch ${{ env.raylib_version }} https://github.com/raysan5/raylib.git
          cd raylib/src

          # Build raylib for web (creates libraylib.a)
          emmake make RAYLIB_LIBTYPE=STATIC

          # Verify the library was built
          ls -la *.a || ls -la

      - name: Setup build directory
        run: |
          mkdir -p build-web
          cp -r assets build-web/

      - name: Create HTML shell
        run: |
          cat > build-web/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <title>VoxelCraft</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body {
                      background: #1a1a2e;
                      display: flex;
                      justify-content: center;
                      align-items: center;
                      height: 100vh;
                      overflow: hidden;
                      font-family: 'Segoe UI', Arial, sans-serif;
                  }
                  #container {
                      text-align: center;
                      color: #eee;
                  }
                  canvas {
                      display: block;
                      max-width: 100%;
                      max-height: 100vh;
                      background: #000;
                  }
                  #loading {
                      font-size: 24px;
                      margin: 20px;
                      animation: pulse 1.5s infinite;
                  }
                  @keyframes pulse {
                      0%, 100% { opacity: 1; }
                      50% { opacity: 0.5; }
                  }
                  #error {
                      color: #ff6b6b;
                      display: none;
                      padding: 20px;
                  }
              </style>
          </head>
          <body>
              <div id="container">
                  <div id="loading">Loading VoxelCraft...</div>
                  <div id="error">WebGL not supported on this device</div>
                  <canvas id="canvas"></canvas>
              </div>
              <script>
                  var Module = {
                      canvas: (function() {
                          var canvas = document.getElementById('canvas');
                          canvas.width = Math.min(window.innerWidth, 1280);
                          canvas.height = Math.min(window.innerHeight, 720);
                          return canvas;
                      })(),
                      setStatus: function(text) {
                          var loading = document.getElementById('loading');
                          if (loading) loading.textContent = text || 'Loaded';
                      },
                      onRuntimeInitialized: function() {
                          var loading = document.getElementById('loading');
                          if (loading) loading.style.display = 'none';
                          console.log('VoxelCraft loaded successfully');
                      },
                      onAbort: function() {
                          document.getElementById('loading').style.display = 'none';
                          document.getElementById('error').style.display = 'block';
                      }
                  };
              </script>
              <script src="voxelcraft.js"></script>
          </body>
          </html>
          EOF

      - name: Build VoxelCraft with Emscripten
        run: |
          . $EMSDK_ENV

          # Copy source files to build-web
          cp -r src build-web/
          cp -r include build-web/

          cd build-web

          # Compile with raylib
          emcc src/*.c \
            -o voxelcraft.js \
            -s WASM=1 \
            -s USE_WEBGL2=1 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s MAXIMUM_MEMORY=268435456 \
            -s ASYNCIFY=1 \
            -s EXPORTED_RUNTIME_METHODS="['ccall','cwrap','setValue','getValue']" \
            -s EXPORTED_FUNCTIONS="['_free', '_malloc']" \
            -s INITIAL_MEMORY=33554432 \
            -s STACK_SIZE=4194304 \
            -s MODULARIZE=1 \
            -s EXPORT_NAME='VoxelCraftModule' \
            -s STRICT=1 \
            -s NO_EXIT_RUNTIME=1 \
            -s IGNORE_MISSING_MAIN=0 \
            -s USE_PTHREADS=0 \
            -O2 \
            -Iinclude \
            -I../raylib/src \
            ../raylib/src/libraylib.a \
            -lm \
            -ldl

          ls -la

      - name: Create output structure
        run: |
          mkdir -p dist
          cp -r build-web/* dist/
          ls -la dist/

      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/
          retention-days: 30

      - name: Create downloadable zip
        run: |
          cd dist && zip -r ../voxelcraft-web.zip . && cd ..
          ls -la voxelcraft-web.zip

      - name: Upload Web Package
        uses: actions/upload-artifact@v4
        with:
          name: voxelcraft-web-package
          path: voxelcraft-web.zip
          retention-days: 90

  deploy-pages:
    needs: build-web
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/web' || startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Web Build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: dist

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
