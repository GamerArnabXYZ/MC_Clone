# Web Build Workflow - Emscripten (WebAssembly)
# Builds the game for web browsers

name: Web Build

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  emsdk_version: '3.1.31'
  raylib_version: '5.0'

jobs:
  build-web:
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:3.1.31

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Emscripten
        run: |
          emsdk activate ${{ env.emsdk_version }}
          source $EMSDK_ENV

      - name: Install Raylib (Web)
        run: |
          git clone https://github.com/raysan5/raylib.git
          cd raylib
          git checkout ${{ env.raylib_version }}
          cd src
          emmake make RAYLIB_LIBTYPE=SHARED RAYLIB_USE_WEBGL=YES

      - name: Setup build directory
        run: |
          mkdir -p build-web
          cp -r assets build-web/

      - name: Build with Emscripten
        run: |
          source $EMSDK_ENV
          emcc -o build-web/index.html \
            -s WASM=1 \
            -s USE_WEBGL=1 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s MAXIMUM_MEMORY=268435456 \
            -s ASYNCIFY=1 \
            -s EXPORTED_RUNTIME_METHODS=['ccall','cwrap'] \
            -s EXPORTED_FUNCTIONS=['_main','_InitGame','_UpdateGame','_DrawGame','_CloseGame'] \
            -s MODULARIZE=1 \
            -s EXPORT_NAME='VoxelCraftModule' \
            -s INITIAL_MEMORY=33554432 \
            -s TOTAL_STACK=4194304 \
            -O2 \
            -I./include \
            -I./raylib/src \
            src/*.c \
            -L./raylib/src \
            -lraylib \
            --shell-file templates/shell.html

      - name: Create output structure
        run: |
          mkdir -p dist
          cp -r build-web/* dist/
          ls -la dist/

      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/
          retention-days: 30

      - name: Create downloadable zip
        run: |
          cd dist && zip -r ../voxelcraft-web.zip . && cd ..
          ls -la voxelcraft-web.zip

      - name: Upload Web Package
        uses: actions/upload-artifact@v4
        with:
          name: voxelcraft-web-package
          path: voxelcraft-web.zip
          retention-days: 90

  deploy-pages:
    needs: build-web
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Web Build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: dist

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
