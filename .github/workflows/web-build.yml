# Web Build Workflow - Emscripten (WebAssembly)
# Builds VoxelCraft for web browsers with legacy device support
# Deploys ALL files (js, wasm, data, html) to the web branch

name: Web Build

on:
  push:
    branches: [main, master, web]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master, web]
  workflow_dispatch:

env:
  raylib_version: '5.0'

jobs:
  build-web:
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:3.1.64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Emscripten
        run: emcc --version

      - name: Install dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends make cmake git ca-certificates

      - name: Clone Raylib
        run: |
          git clone --depth 1 --branch ${{ env.raylib_version }} \
            https://github.com/raysan5/raylib.git raylib

      # Build Raylib for WASM using cmake + emscripten toolchain
      # cmake properly respects SUPPORT_MODULE_RMODELS=OFF etc.
      - name: Build Raylib for Web (WASM)
        run: |
          mkdir -p raylib/build-web
          cd raylib/build-web

          emcmake cmake .. \
            -DPLATFORM=Web \
            -DGRAPHICS=GRAPHICS_API_OPENGL_ES2 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DSUPPORT_MODULE_RMODELS=OFF \
            -DSUPPORT_MODULE_RAUDIO=OFF \
            -DSUPPORT_MODULE_RTEXT=ON \
            -DSUPPORT_MODULE_RSHAPES=ON \
            -DSUPPORT_MODULE_RTEXTURES=ON

          emmake make -j$(nproc) 2>&1

          RAYLIB_A=$(find . -name "libraylib.a" | head -1)
          echo "Built: $RAYLIB_A"
          ls -lh $RAYLIB_A
          echo "RAYLIB_A=raylib/build-web/$RAYLIB_A" >> $GITHUB_ENV

          RAYLIB_SRC=$(realpath ../../raylib/src)
          echo "RAYLIB_SRC=$RAYLIB_SRC" >> $GITHUB_ENV

      - name: Prepare build directory
        run: |
          mkdir -p build-web/assets/textures
          [ -d assets ] && cp -r assets/. build-web/assets/ || true
          cp -r src     build-web/
          cp -r include build-web/

          # Locate raylib artifacts
          RAYLIB_A=$(find raylib/build-web -name "libraylib.a" | head -1)
          echo "RAYLIB_A=$RAYLIB_A" >> $GITHUB_ENV
          echo "RAYLIB_INC=raylib/src" >> $GITHUB_ENV

      # ── Build VoxelCraft WASM ─────────────────────────────────────────────
      # Legacy support notes:
      # - NO USE_WEBGL2: WebGL1 is used for iOS 12 / Android 5 compatibility
      # - ASYNCIFY=1: Required for Raylib's blocking while loop on web
      # - LEGACY_GL_EMULATION=0: Keep off, we use ES2 subset only
      # - -O1 with ASYNCIFY: O2 can break ASYNCIFY instrumentation
      # - USE_GLFW=3: Emscripten provides GLFW2 stubs (resolves glfwInit etc.)
      - name: Build VoxelCraft WASM
        run: |
          cd build-web

          emcc src/main.c src/input.c src/render.c src/world.c \
            -o voxelcraft.js \
            -s WASM=1 \
            -s USE_GLFW=3 \
            -s FULL_ES2=1 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s MAXIMUM_MEMORY=268435456 \
            -s INITIAL_MEMORY=67108864 \
            -s STACK_SIZE=4194304 \
            -s EXPORTED_RUNTIME_METHODS="['ccall','cwrap']" \
            -s NO_EXIT_RUNTIME=1 \
            -s USE_PTHREADS=0 \
            -s FORCE_FILESYSTEM=1 \
            -s ASYNCIFY=1 \
            -s ASYNCIFY_STACK_SIZE=65536 \
            --preload-file assets \
            -O1 \
            -Iinclude \
            -I../$RAYLIB_INC \
            ../$RAYLIB_A \
            -lm \
            -DPLATFORM_WEB

          ls -lh voxelcraft.*
          echo "WASM build OK"

      # ── Create HTML shell with legacy support ─────────────────────────────
      - name: Create HTML shell
        run: |
          cat > build-web/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <meta name="apple-mobile-web-app-capable" content="yes">
              <meta name="mobile-web-app-capable" content="yes">
              <title>VoxelCraft</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body {
                      background: #1a1a2e;
                      display: -webkit-flex;
                      display: flex;
                      -webkit-flex-direction: column;
                      flex-direction: column;
                      -webkit-justify-content: center;
                      justify-content: center;
                      -webkit-align-items: center;
                      align-items: center;
                      height: 100vh;
                      overflow: hidden;
                      font-family: Arial, sans-serif;
                      color: #eee;
                  }
                  #status { font-size: 18px; margin-bottom: 14px; color: #aef; min-height: 22px; }
                  #bar { width: 320px; height: 6px; background: #333; border-radius: 3px; margin-bottom: 14px; overflow: hidden; }
                  #fill { height: 100%; width: 0%; background: #4af; border-radius: 3px;
                          -webkit-transition: width 0.2s; transition: width 0.2s; }
                  #error { color: #f66; display: none; padding: 16px; text-align: center; max-width: 420px; }
                  canvas { display: block; max-width: 100%; max-height: 100vh; touch-action: none; }
              </style>
          </head>
          <body>
              <div id="status">Loading VoxelCraft...</div>
              <div id="bar"><div id="fill"></div></div>
              <div id="error"><strong>WebGL not supported.</strong><br>Try Chrome, Firefox, or Safari 13+.</div>
              <canvas id="canvas" oncontextmenu="return false;"></canvas>
              <script>
                  // Legacy WebGL check (WebGL1 for max compatibility)
                  (function() {
                      var c = document.createElement('canvas');
                      var gl = c.getContext('webgl') || c.getContext('experimental-webgl');
                      if (!gl) {
                          document.getElementById('status').style.display = 'none';
                          document.getElementById('bar').style.display = 'none';
                          document.getElementById('error').style.display = 'block';
                      }
                  })();

                  var statusEl = document.getElementById('status');
                  var fillEl = document.getElementById('fill');

                  var Module = {
                      canvas: document.getElementById('canvas'),
                      setStatus: function(text) {
                          if (!text) {
                              statusEl.style.display = 'none';
                              document.getElementById('bar').style.display = 'none';
                              return;
                          }
                          statusEl.textContent = text;
                          var m = text.match(/(\d+(\.\d+)?)\/(\d+)/);
                          if (m) fillEl.style.width = (parseFloat(m[1]) / parseFloat(m[3]) * 100) + '%';
                      },
                      onRuntimeInitialized: function() {
                          statusEl.style.display = 'none';
                          document.getElementById('bar').style.display = 'none';
                      },
                      print:    function(t) { console.log('[VC]', t); },
                      printErr: function(t) { console.error('[VC]', t); }
                  };

                  window.onerror = function(msg) {
                      statusEl.style.display = 'none';
                      document.getElementById('bar').style.display = 'none';
                      document.getElementById('error').style.display = 'block';
                      document.getElementById('error').innerHTML = '<strong>Error:</strong><br>' + msg;
                  };
              </script>
              <script src="voxelcraft.js"></script>
          </body>
          </html>
          HTMLEOF
          echo "HTML shell created"

      # ── Assemble dist folder ──────────────────────────────────────────────
      - name: Assemble dist
        run: |
          mkdir -p dist
          cp build-web/voxelcraft.js        dist/
          cp build-web/voxelcraft.wasm      dist/
          cp build-web/index.html           dist/
          [ -f build-web/voxelcraft.data ] && cp build-web/voxelcraft.data dist/ || true
          ls -lh dist/

      - name: Upload web-build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/
          retention-days: 30

      - name: Create zip package
        run: |
          cd dist && zip -r ../voxelcraft-web.zip . && cd ..

      - name: Upload web zip
        uses: actions/upload-artifact@v4
        with:
          name: voxelcraft-web-package
          path: voxelcraft-web.zip
          retention-days: 90

  # ── Deploy ALL files to web branch ───────────────────────────────────────
  # Triggers on push to main/master/web OR on version tags.
  # Commits voxelcraft.js, voxelcraft.wasm, voxelcraft.data, index.html
  # directly into the web branch so GitHub Pages serves them.
  deploy-web-branch:
    needs: build-web
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/web' || startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout web branch (create if missing)
        uses: actions/checkout@v4
        with:
          ref: web
          fetch-depth: 0
        continue-on-error: true

      - name: Initialize web branch if it doesn't exist
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # If checkout failed (branch missing), create orphan branch
          git checkout web 2>/dev/null || git checkout --orphan web

      - name: Download web-build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-dist

      - name: Deploy all files to web branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Copy ALL build output files to repo root of web branch
          cp web-dist/voxelcraft.js   ./
          cp web-dist/voxelcraft.wasm ./
          cp web-dist/index.html      ./
          [ -f web-dist/voxelcraft.data ] && cp web-dist/voxelcraft.data ./ || true

          # Ensure GitHub Pages serves from root
          touch .nojekyll

          # Stage all files
          git add voxelcraft.js voxelcraft.wasm index.html .nojekyll
          [ -f voxelcraft.data ] && git add voxelcraft.data || true

          # Commit and push
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "Deploy VoxelCraft web build [$(date '+%Y-%m-%d %H:%M')]"

          git push origin web

  # ── GitHub Pages deploy ───────────────────────────────────────────────────
  deploy-pages:
    needs: build-web
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/web' || startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download web-build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: dist

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
