name: Build VoxelCraft (Android + Web)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.ref }}-build
  cancel-in-progress: true

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  android:
    name: 🤖 Android Build
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > misc/android/local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> misc/android/local.properties

      - name: Copy texpacks asset into app assets folder
        run: |
          mkdir -p misc/android/app/src/main/assets
          cp texpacks/default.zip misc/android/app/src/main/assets/default.zip

      - name: Build release APKs via Gradle
        working-directory: misc/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018 \
            --no-daemon \
            --stacktrace

      - name: Sign APKs
        run: |
          keytool -genkeypair \
            -keystore release.keystore \
            -storetype pkcs12 \
            -alias voxelcraft \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass voxelcraft123 \
            -dname "CN=VoxelCraft,O=ArnabLabZ,C=BD"

          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          APKS_DIR="misc/android/app/build/outputs/apk/release"

          for APK in $APKS_DIR/*.apk; do
            NAME=$(basename "$APK" .apk)
            $BUILD_TOOLS/zipalign -f 4 "$APK" "${NAME}-aligned.apk"
            $BUILD_TOOLS/apksigner sign \
              --ks release.keystore \
              --ks-key-alias voxelcraft \
              --ks-pass pass:voxelcraft123 \
              --out "${NAME}-signed.apk" \
              "${NAME}-aligned.apk"
            echo "✅ Signed: ${NAME}-signed.apk ($(du -sh ${NAME}-signed.apk | cut -f1))"
          done

      - name: Rename APKs for release
        run: |
          # Find and rename signed APKs clearly
          for F in *-signed.apk; do
            if echo "$F" | grep -q "arm64-v8a"; then
              mv "$F" "VoxelCraft-arm64-v8a.apk"
            elif echo "$F" | grep -q "armeabi-v7a"; then
              mv "$F" "VoxelCraft-armeabi-v7a.apk"
            elif echo "$F" | grep -q "x86_64"; then
              mv "$F" "VoxelCraft-x86_64.apk"
            elif echo "$F" | grep -q "universal"; then
              mv "$F" "VoxelCraft-Universal.apk"
            fi
          done
          ls -lh *.apk

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "VoxelCraft - Latest Build"
          body: |
            🤖 **Latest Auto-Generated Build**
            _Last updated: ${{ github.event.head_commit.timestamp }}_
            Commit: `${{ github.sha }}`

            | APK | Platform | Description |
            |-----|----------|-------------|
            | `VoxelCraft-arm64-v8a.apk` | arm64-v8a | Recommended for modern 64-bit devices |
            | `VoxelCraft-armeabi-v7a.apk` | armeabi-v7a | For older 32-bit devices |
            | `VoxelCraft-x86_64.apk` | x86_64 | For emulators and some Chromebooks |
            | `VoxelCraft-Universal.apk` | Multi-arch | Works on all supported devices (larger size) |
          prerelease: true
          make_latest: true
          files: |
            VoxelCraft-arm64-v8a.apk
            VoxelCraft-armeabi-v7a.apk
            VoxelCraft-x86_64.apk
            VoxelCraft-Universal.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voxelcraft-android-apks
          path: "*.apk"
          retention-days: 30

  # ════════════════════════════════════════════════════════════════════════════
  web:
    name: 🌐 Web Build + Deploy
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:3.1.74

    steps:
      - uses: actions/checkout@v4

      - name: Compile webclient → classisphere.js
        shell: bash
        run: |
          emcc src/*.c src/webclient/*.c -o classisphere.js \
            -s WASM=0 \
            -s NO_EXIT_RUNTIME=1 \
            -s LEGACY_VM_SUPPORT=1 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s ABORTING_MALLOC=0 \
            -s ENVIRONMENT=web \
            -s TOTAL_STACK=262144 \
            -s INITIAL_MEMORY=67108864 \
            -s SAFE_HEAP=0 \
            -s ASSERTIONS=0 \
            -s DISABLE_EXCEPTION_CATCHING=1 \
            --js-library src/webclient/interop_web.js \
            -Os \
            -s SINGLE_FILE \
            -Wno-implicit-function-declaration \
            -s ERROR_ON_UNDEFINED_SYMBOLS=0 \
            -s EXPORTED_FUNCTIONS='["_main","_interop_LoadIndexedDB"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap"]'

          sed -i 's#eventHandler.useCapture);#{ useCapture: eventHandler.useCapture, passive: false });#g' classisphere.js
          echo "✅ Build done!"; ls -lh classisphere.js

      - name: Create deployment structure
        shell: bash
        run: |
          mkdir -p deploy/texpacks
          cp classisphere.js      deploy/
          cp index.html           deploy/
          cp texpacks/default.zip deploy/texpacks/default.zip
          date -u --iso-8601=seconds | sed 's/+00:00/Z/' > deploy/update.txt
          echo "Deploy contents:"; ls -lh deploy/ deploy/texpacks/

      - name: Deploy to web branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: web
          publish_dir: ./deploy
          force_orphan: false
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy VoxelCraft Web - ${{ github.sha }}'

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxelcraft-web-client
          path: deploy/
          retention-days: 30
