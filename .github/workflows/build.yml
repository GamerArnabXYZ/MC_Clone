name: Build VoxelCraft (Android + Web)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.ref }}-build
  cancel-in-progress: true

jobs:
  android:
    name: Android build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/saschpe/android-ndk:34-jdk17.0.8_7-ndk25.2.9519653-cmake3.22.1
    steps:
      - uses: actions/checkout@v4

      - name: Retrieve dependencies
        shell: bash
        run: |
          mkdir build-tools
          wget https://github.com/ClassiCube/rpi-compiling-stuff/raw/main/build-tools.zip
          unzip build-tools.zip -d build-tools
          chmod +x build-tools/aapt build-tools/dx build-tools/zipalign

      - name: Compile native libraries
        shell: bash
        run: |
          LATEST_FLAG=-DCC_COMMIT_SHA=\"${GITHUB_SHA::9}\"
          COMMON_FLAGS="-O1 -fno-stack-protector -fno-math-errno -Qn -Werror"
          DROID_FLAGS="-fPIC -shared -fvisibility=hidden -rdynamic -funwind-tables"
          LIBS="-lGLESv2 -lEGL -lm -llog"
          SRCS="src/*.c src/android/*.c third_party/bearssl/*.c"

          NDK_ROOT="/opt/android-sdk-linux/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin"

          $NDK_ROOT/armv7a-linux-androideabi19-clang $SRCS $COMMON_FLAGS $DROID_FLAGS -mfpu=vfp3-d16 $LIBS $LATEST_FLAG -o libvoxelcraft-arm32.so
          $NDK_ROOT/aarch64-linux-android21-clang    $SRCS $COMMON_FLAGS $DROID_FLAGS $LIBS $LATEST_FLAG -o libvoxelcraft-arm64.so

      - name: Build APKs
        shell: bash
        run: |
          ROOT_DIR=$PWD
          TOOLS_ROOT=$ROOT_DIR/build-tools
          SDK_ROOT="/opt/android-sdk-linux/platforms/android-34"
          MAIN_DIR=$ROOT_DIR/misc/android/app/src/main

          keytool -genkeypair \
            -keystore $ROOT_DIR/release.keystore \
            -storetype pkcs12 \
            -alias voxelcraft \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass voxelcraft123 \
            -dname "CN=VoxelCraft,O=ArnabLabZ,C=BD"

          mkdir -p $MAIN_DIR/obj
          cd $MAIN_DIR/java/com/voxelcraft
          javac *.java -d $MAIN_DIR/obj -classpath $SDK_ROOT/android.jar --release 8

          cd $MAIN_DIR
          $TOOLS_ROOT/dx --dex --output=classes.dex ./obj

          sign_apk() {
            ABI=$1
            SO_SRC=$2
            OUT_APK=$3

            rm -rf lib
            mkdir -p lib/$ABI
            cp $ROOT_DIR/$SO_SRC lib/$ABI/libvoxelcraft.so

            $TOOLS_ROOT/aapt package -f -M AndroidManifest.xml -S res -A $ROOT_DIR/texpacks -F unsigned-$ABI.apk -I $SDK_ROOT/android.jar
            $TOOLS_ROOT/aapt add -f unsigned-$ABI.apk classes.dex lib/$ABI/libvoxelcraft.so
            $TOOLS_ROOT/zipalign -f 4 unsigned-$ABI.apk aligned-$ABI.apk
            $TOOLS_ROOT/apksigner sign \
              --ks $ROOT_DIR/release.keystore \
              --ks-key-alias voxelcraft \
              --ks-pass pass:voxelcraft123 \
              --out $ROOT_DIR/$OUT_APK \
              aligned-$ABI.apk
          }

          sign_apk "arm64-v8a"   "libvoxelcraft-arm64.so" "app-arm64-v8a-release.apk"
          sign_apk "armeabi-v7a" "libvoxelcraft-arm32.so" "app-armeabi-v7a-release.apk"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voxelcraft-android-apks
          path: |
            app-arm64-v8a-release.apk
            app-armeabi-v7a-release.apk
          retention-days: 30

  web:
    name: Web build + deploy
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:3.1.50
    steps:
      - uses: actions/checkout@v4

      - name: Compile webclient
        shell: bash
        run: |
          emcc src/*.c src/webclient/*.c -o voxelcraft.js \
            -s WASM=0 \
            -s NO_EXIT_RUNTIME=1 \
            -s LEGACY_VM_SUPPORT=1 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s ABORTING_MALLOC=0 \
            -s ENVIRONMENT=web \
            -s TOTAL_STACK=262144 \
            -s INITIAL_MEMORY=67108864 \
            -s SAFE_HEAP=0 \
            -s ASSERTIONS=0 \
            -s DISABLE_EXCEPTION_CATCHING=1 \
            --js-library src/webclient/interop_web.js \
            -Os \
            -s SINGLE_FILE \
            -Wno-implicit-function-declaration \
            -s ERROR_ON_UNDEFINED_SYMBOLS=0 \
            -s EXPORTED_FUNCTIONS='["_main","_interop_LoadIndexedDB"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap"]'

          sed -i 's#eventHandler.useCapture);#{ useCapture: eventHandler.useCapture, passive: false });#g' voxelcraft.js
          cp voxelcraft.js VoxelCraft.js

      - name: Create deployment structure
        shell: bash
        run: |
          mkdir -p deploy/texpacks
          cp voxelcraft.js deploy/
          cp VoxelCraft.js deploy/
          cp texpacks/default.zip deploy/texpacks/default.zip
          date -u --iso-8601=seconds | sed 's/+00:00/Z/' > deploy/update.txt

      - name: Deploy to web branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: web
          publish_dir: ./deploy
          force_orphan: false
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy VoxelCraft - ${{ github.sha }}'

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxelcraft-web-client
          path: deploy/
          retention-days: 30
