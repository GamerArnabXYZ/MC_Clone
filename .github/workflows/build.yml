name: Build VoxelCraft (Android + Web)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.ref }}-build
  cancel-in-progress: true

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  android:
    name: Android build
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27 + SDK platform 36 + build-tools 36
        run: |
          sdkmanager --install \
            "ndk;27.2.12479018" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Download legacy build tools (aapt, dx, zipalign)
        shell: bash
        run: |
          mkdir build-tools-legacy
          wget -q https://github.com/ClassiCube/rpi-compiling-stuff/raw/main/build-tools.zip
          unzip -q build-tools.zip -d build-tools-legacy
          chmod +x build-tools-legacy/aapt build-tools-legacy/dx build-tools-legacy/zipalign

      - name: Compile native libraries (arm32 + arm64 + x86_64)
        shell: bash
        run: |
          LATEST_FLAG=-DCC_COMMIT_SHA=\"${GITHUB_SHA::9}\"
          COMMON_FLAGS="-O2 -fno-stack-protector -fno-math-errno -Qn"
          DROID_FLAGS="-fPIC -shared -fvisibility=hidden -rdynamic -funwind-tables"
          LIBS="-lGLESv2 -lEGL -lm -llog"
          SRCS="src/*.c src/android/*.c third_party/bearssl/*.c"
          NDK_ROOT="$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"

          $NDK_ROOT/armv7a-linux-androideabi19-clang $SRCS $COMMON_FLAGS $DROID_FLAGS -mfpu=vfp3-d16 $LIBS $LATEST_FLAG -o libvoxelcraft-arm32.so
          $NDK_ROOT/aarch64-linux-android21-clang    $SRCS $COMMON_FLAGS $DROID_FLAGS $LIBS $LATEST_FLAG -o libvoxelcraft-arm64.so
          $NDK_ROOT/x86_64-linux-android21-clang     $SRCS $COMMON_FLAGS $DROID_FLAGS $LIBS $LATEST_FLAG -o libvoxelcraft-x86_64.so

          echo "=== .so sizes ==="
          ls -lh libvoxelcraft-*.so

      - name: Build & sign APKs
        shell: bash
        run: |
          ROOT_DIR=$PWD
          LEGACY=$ROOT_DIR/build-tools-legacy
          SDK_ROOT="$ANDROID_SDK_ROOT/platforms/android-36"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          MAIN_DIR=$ROOT_DIR/misc/android/app/src/main

          keytool -genkeypair \
            -keystore $ROOT_DIR/release.keystore \
            -storetype pkcs12 \
            -alias voxelcraft \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass voxelcraft123 \
            -dname "CN=VoxelCraft,O=ArnabLabZ,C=BD"

          mkdir -p $MAIN_DIR/obj
          cd $MAIN_DIR/java/com/voxelcraft
          javac *.java -d $MAIN_DIR/obj -classpath $SDK_ROOT/android.jar --release 8

          cd $MAIN_DIR
          $LEGACY/dx --dex --output=classes.dex ./obj

          sign_apk() {
            ABI=$1; SO_SRC=$2; OUT_APK=$3
            rm -rf lib; mkdir -p lib/$ABI
            cp $ROOT_DIR/$SO_SRC lib/$ABI/libvoxelcraft.so
            $LEGACY/aapt package -f -M AndroidManifest.xml -S res -A $ROOT_DIR/texpacks \
              -F unsigned-$ABI.apk -I $SDK_ROOT/android.jar
            $LEGACY/aapt add -f unsigned-$ABI.apk classes.dex lib/$ABI/libvoxelcraft.so
            $BUILD_TOOLS/zipalign -f 4 unsigned-$ABI.apk aligned-$ABI.apk
            $BUILD_TOOLS/apksigner sign \
              --ks $ROOT_DIR/release.keystore \
              --ks-key-alias voxelcraft \
              --ks-pass pass:voxelcraft123 \
              --out $ROOT_DIR/$OUT_APK \
              aligned-$ABI.apk
            echo "Built: $OUT_APK ($(du -sh $ROOT_DIR/$OUT_APK | cut -f1))"
          }

          sign_apk "arm64-v8a"   "libvoxelcraft-arm64.so"  "app-arm64-v8a-release.apk"
          sign_apk "armeabi-v7a" "libvoxelcraft-arm32.so"  "app-armeabi-v7a-release.apk"
          sign_apk "x86_64"      "libvoxelcraft-x86_64.so" "app-x86_64-release.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "VoxelCraft Build #${{ github.run_number }}"
          body: |
            🤖 Auto build — commit `${{ github.sha }}`

            | APK | Target |
            |-----|--------|
            | `app-arm64-v8a-release.apk` | Modern 64-bit devices (Android 4.4+) ✅ Recommended |
            | `app-armeabi-v7a-release.apk` | Older 32-bit devices |
            | `app-x86_64-release.apk` | x86_64 emulators / Chromebooks |
          prerelease: true
          files: |
            app-arm64-v8a-release.apk
            app-armeabi-v7a-release.apk
            app-x86_64-release.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voxelcraft-android-apks
          path: |
            app-arm64-v8a-release.apk
            app-armeabi-v7a-release.apk
            app-x86_64-release.apk
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────────
  web:
    name: Web build + deploy
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:3.1.74

    steps:
      - uses: actions/checkout@v4

      - name: Compile webclient
        shell: bash
        run: |
          emcc src/*.c src/webclient/*.c -o voxelcraft.js \
            -s WASM=0 \
            -s NO_EXIT_RUNTIME=1 \
            -s LEGACY_VM_SUPPORT=1 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s ABORTING_MALLOC=0 \
            -s ENVIRONMENT=web \
            -s TOTAL_STACK=262144 \
            -s INITIAL_MEMORY=67108864 \
            -s SAFE_HEAP=0 \
            -s ASSERTIONS=0 \
            -s DISABLE_EXCEPTION_CATCHING=1 \
            --js-library src/webclient/interop_web.js \
            -Os \
            -s SINGLE_FILE \
            -Wno-implicit-function-declaration \
            -s ERROR_ON_UNDEFINED_SYMBOLS=0 \
            -s EXPORTED_FUNCTIONS='["_main","_interop_LoadIndexedDB"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap"]'

          sed -i 's#eventHandler.useCapture);#{ useCapture: eventHandler.useCapture, passive: false });#g' voxelcraft.js
          cp voxelcraft.js VoxelCraft.js
          echo "Build done!"; ls -lh voxelcraft.js

      - name: Generate index.html
        shell: bash
        run: |
          cat > index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
            <meta name="mobile-web-app-capable" content="yes">
            <meta name="apple-mobile-web-app-capable" content="yes">
            <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
            <meta name="theme-color" content="#1a1a2e">
            <title>VoxelCraft</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              html, body { width: 100%; height: 100%; background: #1a1a2e; overflow: hidden; touch-action: none; }
              #game-container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
              canvas { display: block; width: 100% !important; height: 100% !important; image-rendering: pixelated; touch-action: none; }
              #loading-screen {
                position: fixed; inset: 0; background: #1a1a2e;
                display: flex; flex-direction: column; align-items: center; justify-content: center;
                z-index: 9999; font-family: 'Courier New', monospace; color: #fff;
              }
              #loading-screen h1 { font-size: clamp(24px, 6vw, 48px); letter-spacing: 4px; margin-bottom: 24px; text-shadow: 0 0 20px #4fc3f7; }
              #loading-bar-wrap { width: min(320px, 80vw); height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin-bottom: 16px; }
              #loading-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #4fc3f7, #81d4fa); border-radius: 4px; transition: width 0.3s ease; animation: pulse 1.5s ease-in-out infinite; }
              @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
              #loading-text { font-size: 14px; color: #90caf9; letter-spacing: 1px; }
            </style>
          </head>
          <body>
            <div id="loading-screen">
              <h1>VOXELCRAFT</h1>
              <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
              <div id="loading-text">Loading...</div>
            </div>
            <div id="game-container">
              <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
            </div>
            <script>
              var Module = {
                canvas: (function() { return document.getElementById('canvas'); })(),
                setStatus: function(text) {
                  var bar = document.getElementById('loading-bar');
                  var txt = document.getElementById('loading-text');
                  var screen = document.getElementById('loading-screen');
                  if (!text) { if (screen) screen.style.display = 'none'; return; }
                  var match = text.match(/(\d+(\.\d+)?)\/(\d+)/);
                  if (match && bar) bar.style.width = (parseInt(match[1]) / parseInt(match[3]) * 100) + '%';
                  if (txt) txt.textContent = text;
                },
                monitorRunDependencies: function(left) {
                  if (!left) { var b = document.getElementById('loading-bar'); if (b) b.style.width = '100%'; }
                }
              };
            </script>
            <script src="VoxelCraft.js"></script>
          </body>
          </html>
          HTMLEOF
          echo "index.html generated ✅"

      - name: Create deployment structure
        shell: bash
        run: |
          mkdir -p deploy/texpacks
          cp voxelcraft.js deploy/
          cp VoxelCraft.js deploy/
          cp index.html deploy/
          cp texpacks/default.zip deploy/texpacks/default.zip
          date -u --iso-8601=seconds | sed 's/+00:00/Z/' > deploy/update.txt
          echo "Deploy contents:"; ls -lh deploy/ deploy/texpacks/

      - name: Deploy to web branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: web
          publish_dir: ./deploy
          force_orphan: false
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy VoxelCraft - ${{ github.sha }}'

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxelcraft-web-client
          path: deploy/
          retention-days: 30
