<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>VoxelCraft</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            display: -webkit-flex;
            display: flex;
            -webkit-flex-direction: column;
            flex-direction: column;
            -webkit-justify-content: center;
            justify-content: center;
            -webkit-align-items: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: #eee;
        }
        #status { font-size: 18px; margin-bottom: 14px; color: #aef; min-height: 22px; }
        #bar { width: 320px; height: 6px; background: #333; border-radius: 3px; margin-bottom: 14px; overflow: hidden; }
        #fill { height: 100%; width: 0%; background: #4af; border-radius: 3px;
                -webkit-transition: width 0.2s; transition: width 0.2s; }
        #error { color: #f66; display: none; padding: 16px; text-align: center; max-width: 420px; }
        canvas { display: block; max-width: 100%; max-height: 100vh; touch-action: none; }
    </style>
</head>
<body>
    <div id="status">Loading VoxelCraft...</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="error"><strong>WebGL not supported.</strong><br>Try Chrome, Firefox, or Safari 13+.</div>
    <canvas id="canvas" oncontextmenu="return false;"></canvas>
    <script>
        // Legacy WebGL check (WebGL1 for max compatibility)
        (function() {
            var c = document.createElement('canvas');
            var gl = c.getContext('webgl') || c.getContext('experimental-webgl');
            if (!gl) {
                document.getElementById('status').style.display = 'none';
                document.getElementById('bar').style.display = 'none';
                document.getElementById('error').style.display = 'block';
            }
        })();

        var statusEl = document.getElementById('status');
        var fillEl = document.getElementById('fill');

        var Module = {
            canvas: document.getElementById('canvas'),
            setStatus: function(text) {
                if (!text) {
                    statusEl.style.display = 'none';
                    document.getElementById('bar').style.display = 'none';
                    return;
                }
                statusEl.textContent = text;
                var m = text.match(/(\d+(\.\d+)?)\/(\d+)/);
                if (m) fillEl.style.width = (parseFloat(m[1]) / parseFloat(m[3]) * 100) + '%';
            },
            onRuntimeInitialized: function() {
                statusEl.style.display = 'none';
                document.getElementById('bar').style.display = 'none';
            },
            print:    function(t) { console.log('[VC]', t); },
            printErr: function(t) { console.error('[VC]', t); }
        };

        window.onerror = function(msg) {
            statusEl.style.display = 'none';
            document.getElementById('bar').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error').innerHTML = '<strong>Error:</strong><br>' + msg;
        };
    </script>
    <script src="voxelcraft.js"></script>
</body>
</html>
